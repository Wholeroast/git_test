<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GBP Photo Picker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>GBP Photo Picker</h1>
        <p class="hint">Open a GBP Photos tab, then scan.</p>
        <button id="scanPhotos" class="primary">Scan current page</button>
        <div id="profileName" class="profile-name"></div>
        <p id="status" class="status"></p>
      </header>
      <div id="photoGrid" class="grid empty">
        <p class="empty-state">No photos loaded yet.</p>
      </div>
      <div class="options">
        <div class="format">
          <label for="formatSelect">Format</label>
          <select id="formatSelect">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
        <div class="bulk">
          <button id="selectAll" class="ghost">Select all</button>
          <button id="clearAll" class="ghost">Clear</button>
        </div>
      </div>
      <button id="downloadSelected" class="download" disabled>
        Download selected
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
